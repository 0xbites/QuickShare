# Render Blueprint.
#
# Keeps the deployment definition in the repository rather than in dashboard
# state, so a change to how this service runs is reviewable like any other change.
#
# Secrets are declared with `sync: false`, which means Render prompts for the value
# on first deploy and stores it itself. No credential belongs in this file.

services:
  - type: web
    name: quickshare
    runtime: node
    plan: free
    # Must stay near the Neon project's region. The database is in
    # ap-southeast-1, and every request makes at least one query, so a
    # cross-region pairing adds latency to each of them.
    region: singapore

    # `npm ci` rather than `npm install`: it installs exactly what
    # package-lock.json pins instead of re-resolving the ^ ranges at build time,
    # so the deploy runs the dependency tree that was tested.
    buildCommand: npm ci
    startCommand: npm run serve

    # Queries the database, so a deploy that boots without Postgres is reported
    # as failed rather than live.
    healthCheckPath: /healthz

    envVars:
      # ---- required, no safe default ----

      # Neon pooled connection string. Pooled matters: db/pool.js opens up to 10
      # clients, above the free tier's direct-connection limit.
      - key: DATABASE_URL
        sync: false

      # This service's own origin, no trailing slash. Share links are built from
      # it, so a wrong value produces links that point somewhere else.
      - key: APP_BASE_URL
        sync: false

      # ---- abuse controls ----

      # One proxy sits in front on Render. Without this, req.ip is the balancer
      # and every client in the world shares a single rate-limit bucket.
      - key: TRUST_PROXY
        value: "1"

      # Keyed hash for reporter addresses. Generated by Render and then stable, so
      # a repeat reporter stays recognisable across the restarts this tier does
      # constantly.
      - key: IP_HASH_SECRET
        generateValue: true

      # ---- storage ----

      # Object storage, not local disk. The free tier's filesystem is wiped on
      # every restart, which would leave rows resolving to blobs that no longer
      # exist.
      - key: STORAGE_DRIVER
        value: s3

      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto

      # ---- limits tuned for a 512 MB instance ----

      # 25 MB rather than the 100 MB default. Both paths currently hold whole
      # objects in memory — express.raw buffers the upload, and read() returns a
      # complete Buffer — so concurrent transfers at 100 MB can exhaust the
      # instance. Raise this once both paths stream.
      - key: MAX_UPLOAD_BYTES
        value: "26214400"

      # Well inside R2's 10 GB free allowance.
      - key: STORAGE_CEILING_BYTES
        value: "5368709120"

      # PORT is injected by Render and must not be set here.
